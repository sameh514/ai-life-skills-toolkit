name: Validate toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/privacy_scan.py
      - run: python scripts/validate_skills.py
      - run: python scripts/check_markdown_links.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s personal-vault/tests -v
      - run: python -m compileall -q scripts personal-vault skills
      - run: python scripts/install_skills.py --platform ${{ matrix.platform }} --destination .test-skills
